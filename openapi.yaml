openapi: 3.0.3
info:
  title: Syte API
  version: 2.0.0
  description: 'Syte''s product discovery API: visual search, recommendations, text search, collections, widgets
    and event tracking. Every call needs your Syte account ID and API key, which you get from Syte.'
servers:
- url: https://cdn-api.syteapi.com
  description: Production
tags:
- name: Visual search
- name: Recommendations
- name: Recently viewed
- name: Text search
- name: Collections and galleries
- name: Widgets
- name: Event tracking
paths:
  /v1.1/offers/bb:
    get:
      tags:
      - Visual search
      summary: Detect products in an image
      description: 'Step 1 of visual search. Detects the products in an image. The response is keyed by the image
        URL, with one entry per detected item: its category, its position and its own `offers` link. Call that link
        to get matching products (step 2). Do not send `fields` here: it makes the call fail with `422 malformed
        url list`. Add `fields` to the offers call instead. See the [Visual search guide](/visual-search) for the
        full flow.'
      operationId: getBoundsGET
      parameters:
      - name: imageUrl
        in: query
        required: true
        schema:
          type: string
          format: uri
        example: https://cdn.example.com/photos/street-style-01.jpg
        description: URL of the image to analyze, or an inline base64 data URL.
      - name: sku
        in: query
        required: false
        schema:
          type: string
        example: ABC123
        description: Forces matching against a known product SKU.
      - name: gender
        in: query
        required: false
        schema:
          type: string
        example: female
        description: Restricts or biases detection and matching to the given gender.
      - $ref: '#/components/parameters/MatchFilter'
      - $ref: '#/components/parameters/Catalog'
      - $ref: '#/components/parameters/Feed'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/SessionSkus'
      - $ref: '#/components/parameters/Locale'
      - $ref: '#/components/parameters/AccountId'
      - name: syte_uuid
        in: query
        required: false
        schema:
          type: string
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        description: User/session identifier, forwarded into the similar-items link included in the response.
      - name: galleryName
        in: query
        required: false
        schema:
          type: string
        example: summer-lookbook
        description: Name of the inspirational-image gallery to pull from; required in inspirational-images mode.
      - name: syte_product
        in: query
        required: false
        schema:
          type: string
        example: camera
        description: Selects the calling surface/mode (camera, discovery_button, inspirational_images, ...).
      - $ref: '#/components/parameters/SyteAppRef'
      - $ref: '#/components/parameters/SyteContext'
      - $ref: '#/components/parameters/VariantId'
      - name: sig
        in: query
        required: false
        schema:
          type: string
        example: a1b2c3d4e5f6
        description: Authenticates the request and is also forwarded into the generated offer link.
      responses:
        '200':
          description: Detected bounding boxes for the image, each with a link to matched offers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  experimentId:
                    type: string
                  variantId:
                    type: string
                  meta:
                    type: object
                    properties:
                      shopVersionId:
                        type: string
                      updatedAt:
                        type: string
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      b0:
                        type: array
                        items:
                          type: number
                      b1:
                        type: array
                        items:
                          type: number
                      center:
                        type: array
                        items:
                          type: number
                      label:
                        type: string
                      catalog:
                        type: string
                      gender:
                        type: string
                      ref_id:
                        type: string
                      offers:
                        type: string
                        description: Link to the matching products for this detected item.
                      logo:
                        type: string
                      deeptags:
                        type: object
                      fallback:
                        type: boolean
                        description: Present only when truthy.
                      matchDetails:
                        type: object
                        description: Present only when `syte_product=inspirational_images`.
              example:
                https://shop.example.com/images/abc124.jpg:
                - label: Shirts
                  gender: female
                  catalog: fashion
                  center:
                  - 0.49
                  - 0.33
                  b0:
                  - 0.34
                  - 0.19
                  b1:
                  - 0.64
                  - 0.48
                  offers: https://cdn-api.syteapi.com/v1.1/offers?image_url=BASE64_IMAGE_URL&crop=BASE64_CROP&cats=BASE64_CATEGORY&catalog=fashion&gender=female&syte_product=discovery_button&account_id=YOUR_ACCOUNT_ID&sig=YOUR_API_KEY
                - label: Trousers
                  gender: female
                  catalog: fashion
                  center:
                  - 0.51
                  - 0.71
                  b0:
                  - 0.38
                  - 0.49
                  b1:
                  - 0.63
                  - 0.93
                  offers: https://cdn-api.syteapi.com/v1.1/offers?image_url=BASE64_IMAGE_URL&crop=BASE64_CROP&cats=BASE64_CATEGORY&catalog=fashion&gender=female&syte_product=discovery_button&account_id=YOUR_ACCOUNT_ID&sig=YOUR_API_KEY
        '400':
          description: Missing or invalid required parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: The image URL is not on the account's whitelisted domains.
        '422':
          description: The request could not be parsed, for example because `fields` was sent.
          content:
            application/json:
              example: malformed url list
        '500':
          description: A server error occurred while resolving an inspirational-images gallery match.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
    post:
      tags:
      - Visual search
      summary: Detect products in an uploaded image
      operationId: getBoundsPOST
      parameters:
      - name: payload_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - image_urls
          - image_bin
          default: image_urls
        example: image_urls
        description: Selects how the request body is interpreted.
      - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uri
              description: List of image URLs to analyze, used when payload_type is image_urls (default).
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw image bytes, used when payload_type is image_bin.
      responses:
        '200':
          description: Same response shape as the GET variant.
        '400':
          description: Missing or invalid required parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/InvalidApiKey'
      description: Step 1 of visual search, for an uploaded image or a list of image URLs. Returns the same detected
        items and `offers` links as the GET version. See the [Visual search guide](/visual-search) for the full
        flow.
  /offers:
    get:
      tags:
      - Visual search
      summary: Find products matching an image
      description: 'Step 2 of visual search. Returns catalog products that match one detected item, in `ads`. You
        normally do not build this call yourself: call the `offers` link that Detect products returned for that
        item, and add `fields` for the product data you need and `size` for how many results. Also reachable at
        /v1.1/offers. See the [Visual search guide](/visual-search) for the full flow.'
      operationId: getOffers
      parameters:
      - name: image_url
        in: query
        required: true
        schema:
          type: string
          format: byte
        example: aHR0cHM6Ly9jZG4uZXhhbXBsZS5jb20vcGhvdG9zL2RyZXNzLmpwZw==
        description: Base64-encoded image URL to match against.
      - name: crop
        in: query
        required: false
        schema:
          type: string
          format: byte
        example: eyJ4MCI6MCwieTAiOjAsIngxIjoxLCJ5MSI6MX0=
        description: Base64-encoded JSON crop box; defaults to the full image.
      - name: sku
        in: query
        required: false
        schema:
          type: string
        example: ABC123
        description: Restricts matching to a specific known product SKU.
      - name: syte_product
        in: query
        required: false
        schema:
          type: string
        example: camera
        description: Selects the calling surface/mode; defaults to camera, or discovery_button when sku is supplied.
      - name: sorting
        in: query
        required: false
        schema:
          type: string
        example: price_asc
        description: Sort order for the returned offers; invalid values are ignored.
      - $ref: '#/components/parameters/VariantFields'
      - $ref: '#/components/parameters/AdditionalSizeVariantFields'
      - name: filters
        in: query
        required: false
        schema:
          type: string
        example: '{"price":{"min":10,"max":100}}'
        description: JSON filter expression applied to narrow the matched offers.
      - $ref: '#/components/parameters/MatchFilter'
      - $ref: '#/components/parameters/Catalog'
      - $ref: '#/components/parameters/Feed'
      - name: gender
        in: query
        required: false
        schema:
          type: string
        example: female
        description: Restricts or biases matched offers to the given gender.
      - name: session_skus
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example:
        - SKU123
        - SKU456
        description: Accepted, but has no effect on this endpoint's matching or analytics.
      - $ref: '#/components/parameters/Locale'
      - name: session_id
        in: query
        required: false
        schema:
          type: string
        example: sess_9f2c8a
        description: Forwarded into analytics only; not included in the JSON response.
      - $ref: '#/components/parameters/SyteAppRef'
      - $ref: '#/components/parameters/SyteContext'
      - $ref: '#/components/parameters/Fields'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        example: 24
        description: Ignored on this endpoint. Use `size` to control how many results come back.
      - name: from
        in: query
        required: false
        schema:
          type: integer
        example: 0
        description: Pagination offset into the matched offers.
      - name: size
        in: query
        required: false
        schema:
          type: integer
        example: 24
        description: Number of offers to return per page.
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/VariantId'
      - $ref: '#/components/parameters/UserUuid'
      - name: request_id
        in: query
        required: false
        schema:
          type: string
        example: req_7d3f1a
        description: Client-supplied request correlation id for logging/tracing.
      - name: sig
        in: query
        required: false
        schema:
          type: string
        example: a1b2c3d4e5f6
        description: Authenticates the request.
      responses:
        '200':
          description: Matched offers for the queried image.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ads:
                    type: array
                    items:
                      type: object
                  currency_tla:
                    type: string
                  currency_symbol:
                    type: string
                  aggregations:
                    type: object
                    description: Present only when `add_aggregations` is set and at least one facet was computed.
                  original_item:
                    type: array
                    items:
                      type: object
                    description: Single-element array wrapping the queried item.
                  experimentId:
                    type: string
                  variantId:
                    type: string
                  meta:
                    type: object
                    properties:
                      shopVersionId:
                        type: string
                      updatedAt:
                        type: string
              example:
                total: 100
                currency_tla: EUR
                currency_symbol: €
                ads:
                - sku: ABC124
                  parent_sku: ABC100
                  description: Striped cotton shirt
                  price: €19.99
                  originalPrice: €19.99
                  floatPrice: 19.99
                  floatOriginalPrice: 19.99
                  imageUrl: https://shop.example.com/images/abc124.jpg
                  offer: https://shop.example.com/p/abc124.html
                  categories:
                  - Women > Tops > Shirts
                  brand: Example Brand
                  merchant: Example Store
                  bbCategories:
                  - Shirts
        '400':
          description: Missing or invalid required parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: No products matched the image.
          content:
            application/json:
              example:
                message: no matches found.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
  /v1.1/similars:
    get:
      tags:
      - Recommendations
      summary: Similar items and Shop the Look
      operationId: getSimilars
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        example: sku:ABC123
        description: The item to find similars for, in the form <key>:<value>, e.g. sku:ABC123.
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/Catalog'
      - $ref: '#/components/parameters/Feed'
      - name: gender
        in: query
        required: false
        schema:
          type: string
        example: female
        description: Restricts or biases similar-item results to the given gender.
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/SyteAppRef'
      - $ref: '#/components/parameters/SessionSkus'
      - $ref: '#/components/parameters/Locale'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/SyteContext'
      - name: syte_product
        in: query
        required: false
        schema:
          type: string
        example: similars
        description: Identifies the calling surface/mode for this request.
      - name: imageUrl
        in: query
        required: false
        schema:
          type: string
          format: uri
        example: https://cdn.example.com/photos/dress.jpg
        description: Finds similars to the item detected in this image instead of the item identified by q.
      - $ref: '#/components/parameters/VariantFields'
      - $ref: '#/components/parameters/AdditionalSizeVariantFields'
      - name: features
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - similars
            - ctl
          default:
          - similars
        example:
        - similars
        description: Selects the ranking strategy/strategies used, e.g. features=similars,ctl.
      - $ref: '#/components/parameters/MatchFilter'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        example: 24
        description: Maximum total number of similar items to return.
      - $ref: '#/components/parameters/VariantId'
      - $ref: '#/components/parameters/UserUuid'
      responses:
        '200':
          description: Similar items, or grouped shop-the-look results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      type: object
                  original_item:
                    type: array
                    items:
                      type: object
                    description: Single-element array wrapping the queried item.
                  fallback:
                    type: string
                    description: Either `"null"` or `"imageUrl"`. Present when `imageUrl` was supplied.
                  experimentId:
                    type: string
                  variantId:
                    type: string
                  meta:
                    type: object
                    properties:
                      shopVersionId:
                        type: string
                      updatedAt:
                        type: string
              example:
                response:
                - &id001
                  sku: ABC124
                  parent_sku: ABC100
                  description: Striped cotton pyjamas
                  price: €25.99
                  originalPrice: €25.99
                  floatPrice: 25.99
                  floatOriginalPrice: 25.99
                  imageUrl: https://shop.example.com/images/abc124.jpg
                  offer: https://shop.example.com/p/abc124.html
                  categories:
                  - Women > Nightwear > Pyjamas
                  brand: Example Brand
                  merchant: Example Store
                - &id002
                  sku: ABC131
                  parent_sku: ABC130
                  description: Gingham cotton shorts
                  price: €19.99
                  originalPrice: €19.99
                  floatPrice: 19.99
                  floatOriginalPrice: 19.99
                  imageUrl: https://shop.example.com/images/abc131.jpg
                  offer: https://shop.example.com/p/abc131.html
                  categories:
                  - Women > Shorts
                  brand: Example Brand
                  merchant: Example Store
        '400':
          description: Missing or invalid required parameter, such as q.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/InvalidApiKey'
      description: Find visually or semantically similar items to a product or image (also used for Shop the Look).
        By default each item only includes `sku`. Use `fields` to choose which product fields come back.
  /v1.1/personalization:
    get:
      tags:
      - Recommendations
      summary: Personalized recommendations
      operationId: getPersonalization
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/VariantId'
      - $ref: '#/components/parameters/UserUuid'
      - name: syte_product
        in: query
        required: false
        schema:
          type: string
          enum:
          - personalization
          - bought_together
          default: personalization
        example: personalization
        description: Selects between personalized recommendations and frequently-bought-together items.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        example: 20
        description: Maximum number of items to return; defaults to 20.
      - $ref: '#/components/parameters/VariantFields'
      - $ref: '#/components/parameters/AdditionalSizeVariantFields'
      - $ref: '#/components/parameters/Feed'
      - $ref: '#/components/parameters/Catalog'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/SyteAppRef'
      - $ref: '#/components/parameters/Locale'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/SyteContext'
      - name: session_skus
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example:
        - SKU123
        - SKU456
        description: SKUs already seen or interacted with, used as personalization/bought-together input.
      - name: model_version
        in: query
        required: false
        schema:
          type: string
          default: A
        example: A
        description: Selects the recommendation model version.
      responses:
        '200':
          description: Recommended items; the exact shape depends on the response format and whether a fallback
            was used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationResponse'
              example:
                results:
                - *id001
                - *id002
                fallback: best_sellers
        '404':
          description: No items were found for this request.
        '500':
          description: An unrecognized value was supplied for syte_product or sorting_order.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
      description: Get personalized recommendations, or frequently-bought-together items. By default each item only
        includes `sku`. Use `fields` to choose which product fields come back.
    post:
      tags:
      - Recommendations
      summary: Personalized recommendations (JSON body)
      operationId: postPersonalization
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/VariantId'
      - $ref: '#/components/parameters/Feed'
      - $ref: '#/components/parameters/Catalog'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/SyteAppRef'
      - $ref: '#/components/parameters/Locale'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/SyteContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Only these four keys are accepted; any other body key is rejected.
              required:
              - user_uuid
              - session_skus
              properties:
                user_uuid:
                  type: string
                  format: uuid
                  description: Identifies the user to personalize recommendations for.
                session_skus:
                  type: array
                  items:
                    type: string
                  description: SKUs already seen or interacted with, used as input signal.
                ad_url:
                  type: string
                  format: uri
                  description: Resolves a SKU from this URL and adds it to session_skus.
                model_version:
                  type: string
                  enum:
                  - A
                  - B
                  default: A
                  description: Selects the recommendation model version.
      responses:
        '200':
          description: Same response shape as GET /v1.1/personalization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationResponse'
              example:
                results:
                - *id001
                - *id002
                fallback: best_sellers
        '400':
          description: An unknown body field was supplied, or a required field is missing.
        '404':
          description: No items were found for this request.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
      description: Same as GET, but with a JSON request body instead of query parameters for the core inputs. By
        default each item only includes `sku`. Use `fields` to choose which product fields come back.
  /search/{accountId}/items:
    get:
      tags:
      - Text search
      summary: Search products
      operationId: searchItems
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
        example: '12345'
        description: Identifies the account to search within; must be numeric.
      - name: query
        in: query
        required: false
        schema:
          type: string
        example: robe
        description: The search term.
      - name: filters
        in: query
        required: false
        schema:
          type: string
        example: '{"category":"dresses"}'
        description: JSON filter object narrowing the search results.
      - name: sorting
        in: query
        required: false
        schema:
          type: string
        example: price_asc
        description: Sort order for the returned search results.
      - name: from
        in: query
        required: false
        schema:
          type: integer
          default: 0
        example: 0
        description: Pagination offset into the result set.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 30
        example: 24
        description: Number of results to return per page.
      - $ref: '#/components/parameters/Locale'
      - name: lang
        in: query
        required: false
        schema:
          type: string
        example: en
        description: Language used for search-text tokenization, independent of locale.
      - name: showAllExactResults
        in: query
        required: false
        schema:
          type: boolean
        example: false
        description: When true, returns all exact-match results instead of a capped/paginated set.
      - name: force_currency
        in: query
        required: false
        schema:
          type: string
        example: USD
        description: Overrides the account's default currency for displayed prices.
      - $ref: '#/components/parameters/VariantFields'
      - $ref: '#/components/parameters/AdditionalSizeVariantFields'
      - name: customer_feed
        in: query
        required: false
        schema:
          type: string
        example: default
        description: Overrides the configured feed list used for this search.
      - name: text_search_variants
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        example: 'true'
        description: When "true", merges size/color product variants into results and groups by parent SKU.
      - $ref: '#/components/parameters/SyteContext'
      - name: fields
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example:
        - sku
        - price
        - imageUrl
        description: Sparse-fieldset selector; currently has no effect on this endpoint's response shape.
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - RawQuery
          - NoSynonyms
        example: NoSynonyms
        description: Selects the synonym-expansion mode for the search query.
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Search results, with pagination and facet information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
                    description: Always `null` on a 200 response.
                  result:
                    type: object
                    properties:
                      total:
                        type: integer
                      hits:
                        type: array
                        items:
                          type: object
                      exactCount:
                        type: integer
                      recognizedTagging:
                        type: object
                        description: Always an empty object - not currently populated.
                      aggregations:
                        type: object
                      suggestedPages:
                        type: array
                        items:
                          type: object
                        description: Present only when the account's `redirect_on_items` flag is set and no autocomplete-style
                          suggest data applies; when suggest data applies, `result` is replaced entirely by that
                          shape instead.
                  requestId:
                    type: string
                  searchType:
                    type: string
                  originalSearchTerm:
                    type: string
                    description: The `query` value after trimming/whitespace-collapsing.
                  message:
                    type: string
                    description: Present only when the search fell back to a corrected search term; paired with
                      `correctedSearchTerm`.
                  correctedSearchTerm:
                    type: string
                  experimentId:
                    type: string
                  variantId:
                    type: string
                  meta:
                    type: object
                    properties:
                      shopVersionId:
                        type: string
                      updatedAt:
                        type: string
              example:
                searchType: regular
                result:
                  total: 9
                  suggestedPages: []
                  recognizedTagging: {}
                  hits:
                  - sku: ABC210
                    parent_sku: ABC200
                    title: Fleece robe
                    description: Fleece robe
                    price: €45.99
                    originalPrice: €45.99
                    floatPrice: '45.99'
                    floatOriginalPrice: '45.99'
                    imageUrl: https://shop.example.com/images/abc210.jpg
                    offer: https://shop.example.com/p/abc210.html
                    brand: Example Brand
                    syte_sizes: '["L"]'
                    syte_colors: '["Grey"]'
                    score: 50
                    sales_count: 0
        '400':
          description: Non-numeric accountId, or a query longer than 150 characters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: The account is blacklisted.
        '405':
          description: Returned for any method other than GET.
        '500':
          description: Server error. `missing feeds in config` means text search is not set up for your account
            yet.
          content:
            application/json:
              example:
                error:
                  requestId: 4c46871e-6169-471a-8e1b-13e873a72aee
                  message: missing feeds in config
                  code: 500
        '401':
          $ref: '#/components/responses/InvalidApiKey'
      description: Full-text search over the account's product catalog. `searchType` is `fallback` when nothing
        matched the term directly and fallback results were returned.
      security:
      - SigQuery: []
  /search/{accountId}/autocomplete:
    get:
      tags:
      - Text search
      summary: Autocomplete
      operationId: autocomplete
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
        example: '12345'
        description: Identifies the account to search within; must be numeric.
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ''
          maxLength: 150
        example: red dr
        description: Partial search text for autocomplete suggestions; defaults to empty.
      - name: lang
        in: query
        required: false
        schema:
          type: string
        example: en
        description: Language used for suggestion tokenization/matching.
      - $ref: '#/components/parameters/Locale'
      - name: fields
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
        example:
        - sku
        - imageUrl
        description: Comma-separated response fields to include on suggested-item results.
      - name: autocomplete_variants
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        example: 'true'
        description: When "true", merges size/color product variants into suggested results.
      - name: showAllExactResults
        in: query
        required: false
        schema:
          type: boolean
        example: false
        description: Raises the result cap for autocomplete requests.
      - name: mode
        in: query
        required: false
        schema:
          type: string
        example: no_synonyms
        description: Selects the synonym-expansion mode for autocomplete queries.
      - name: customer_feed
        in: query
        required: false
        schema:
          type: string
        example: default
        description: Overrides the configured feed list, same as on the items search endpoint.
      - name: force_currency
        in: query
        required: false
        schema:
          type: string
        example: USD
        description: Overrides the account's default currency for suggested-item prices.
      - $ref: '#/components/parameters/VariantFields'
      - $ref: '#/components/parameters/AdditionalSizeVariantFields'
      - $ref: '#/components/parameters/SessionId'
      - name: syte_context
        in: query
        required: false
        schema:
          type: string
        example: widget
        description: Identifies the calling surface; also affects suggested redirect pages in the response.
      responses:
        '200':
          description: Autocomplete suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
                    description: Always `null` on a 200 response.
                  requestId:
                    type: string
                  experimentId:
                    type: string
                  variantId:
                    type: string
                  meta:
                    type: object
                    properties:
                      shopVersionId:
                        type: string
                      updatedAt:
                        type: string
                  results:
                    type: object
                    properties:
                      allResults:
                        type: string
                        description: Always the empty string, not an array - hardcoded, never populated.
                      suggestedItems:
                        type: array
                        items: {}
                      suggestedCategories:
                        type: array
                        items: {}
                        description: Always an empty array - hardcoded, never populated.
                      suggestedPages:
                        type: array
                        items: {}
                      suggestedSearchTerms:
                        type: array
                        items: {}
        '204':
          description: No results were found and the account allows empty results.
        '404':
          description: No data for this account yet.
          content:
            application/json:
              example:
                requestId: fd66c3e0-b14d-43d4-981a-8e74741092b0
        '405':
          description: Returned for any method other than GET.
        '500':
          description: Server error. `missing feeds in config` means text search is not set up for your account
            yet.
          content:
            application/json:
              example:
                error:
                  requestId: 4c46871e-6169-471a-8e1b-13e873a72aee
                  message: missing feeds in config
                  code: 500
        '400':
          description: Non-numeric accountId, or a query longer than 150 characters.
        '403':
          description: The account is blacklisted.
        '401':
          $ref: '#/components/responses/InvalidApiKey'
      description: Get search-term autocomplete suggestions.
      security:
      - SigQuery: []
  /search/{accountId}/popularSearches:
