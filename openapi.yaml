  /et:
    servers:
    - url: https://syteapi.com
      description: Production. Event tracking only.
    post:
      tags:
      - Event tracking
      summary: Track an event
      description: Track an interaction event (schema-less tracking beacon). Also reachable at /eet. Query string
        and JSON body are merged into a single event payload.
      operationId: trackEvent
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserUuid'
      - $ref: '#/components/parameters/SessionSkus'
      - name: coords
        in: query
        required: false
        schema:
          type: string
          format: byte
        example: eyJ4MCI6MC4xLCJ5MCI6MC4yLCJ4MSI6MC41LCJ5MSI6MC42fQ==
        description: Base64+JSON-encoded bounding-box coordinates of the interacted-with region.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Arbitrary key/value pairs merged into the tracked event.
      responses:
        '204':
          description: Event accepted. Always 204 No Content.
        '400':
          description: The request body is not valid JSON, or account_id/API key is missing or invalid.
        '401':
          description: The supplied API key does not match the account's configured key.
        '403':
          description: The account is blacklisted, unconfigured, or not permitted from this location.
    get:
      tags:
      - Event tracking
      summary: Track an event (GET)
      description: Same as the POST version, sent as a GET. Also reachable at /eet.
      operationId: trackEventGet
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserUuid'
      - $ref: '#/components/parameters/SessionSkus'
      - name: coords
        in: query
        required: false
        schema:
          type: string
          format: byte
        example: eyJ4MCI6MC4xLCJ5MCI6MC4yLCJ4MSI6MC41LCJ5MSI6MC42fQ==
        description: Same bounding-box coordinates as on the POST operation above.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Same optional merge-in body semantics as the POST operation above.
      responses:
        '204':
          description: Event accepted. Always 204 No Content.
        '400':
          description: A request body was supplied but is not valid JSON, or account_id/API key is missing or invalid.
        '401':
          description: The supplied API key does not match the account's configured key.
        '403':
          description: The account is blacklisted, unconfigured, or not permitted from this location.
  /eet:
    servers:
    - url: https://syteapi.com
      description: Production. Event tracking only.
    post:
      tags:
      - Event tracking
      summary: Track an event (alias)
      operationId: trackEventAlias
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserUuid'
      - $ref: '#/components/parameters/SessionSkus'
      - name: coords
        in: query
        required: false
        schema:
          type: string
          format: byte
        example: eyJ4MCI6MC4xLCJ5MCI6MC4yLCJ4MSI6MC41LCJ5MSI6MC42fQ==
        description: Same bounding-box coordinates as on /et's POST operation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Same optional merge-in body semantics as /et's POST operation.
      responses:
        '204':
          description: Event accepted. Always 204 No Content.
        '400':
          description: The request body is not valid JSON, or account_id/API key is missing or invalid.
        '401':
          description: The supplied API key does not match the account's configured key.
        '403':
          description: The account is blacklisted, unconfigured, or not permitted from this location.
      description: Track an interaction event (alias of /et).
      x-hidden: true
    get:
      tags:
      - Event tracking
      summary: Track an event (alias, GET)
      operationId: trackEventGetAlias
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/UserUuid'
      - $ref: '#/components/parameters/SessionSkus'
      - name: coords
        in: query
        required: false
        schema:
          type: string
          format: byte
        example: eyJ4MCI6MC4xLCJ5MCI6MC4yLCJ4MSI6MC41LCJ5MSI6MC42fQ==
        description: Same bounding-box coordinates as on /et's GET operation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Same optional merge-in body semantics as /et's GET operation.
      responses:
        '204':
          description: Event accepted. Always 204 No Content.
        '400':
          description: A request body was supplied but is not valid JSON, or account_id/API key is missing or invalid.
        '401':
          description: The supplied API key does not match the account's configured key.
        '403':
          description: The account is blacklisted, unconfigured, or not permitted from this location.
      description: Track an interaction event via GET (alias of /et).
      x-hidden: true
