components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Your Syte API key. Use this for server-side calls.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: The same API key, passed as a query parameter.
    SyteApiKeyHeader:
      type: apiKey
      in: header
      name: syte-api-key
      description: Your Syte API key, for the recently viewed, collections, gallery and widget endpoints. These
        endpoints do not accept `x-api-key` or `api_key`.
    SigQuery:
      type: apiKey
      in: query
      name: sig
      description: Your API key as the `sig` query parameter. Text search, autocomplete and popular searches only
        accept the key this way.
  parameters:
    AccountId:
      name: account_id
      in: query
      required: true
      schema:
        type: string
      example: '12345'
      description: Identifies the Syte account the request is scoped to.
    AccountIdPath:
      name: accountid
      in: path
      required: true
      schema:
        type: string
      example: '12345'
      description: Identifies the Syte account the request is scoped to, carried as a path segment.
    AdditionalSizeVariantFields:
      name: additional_size_variant_fields
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
      example:
      - size_eu
      - size_uk
      description: Comma-separated extra size-variant fields, added on top of variant_fields.
    Catalog:
      name: catalog
      in: query
      required: false
      schema:
        type: string
      example: fashion
      description: Product catalog/vertical (e.g. fashion, home, diy) to match or tag against.
    CollectionsFilters:
      name: filters
      in: query
      required: false
      schema:
        type: string
      example: color:blue
      description: Server-side filter expression applied to the collection's items.
    CollectionsFrom:
      name: from
      in: query
      required: false
      schema:
        type: integer
        default: 0
      example: 0
      description: Pagination offset into the collection's matched items; defaults to 0.
    CollectionsSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      example: 20
      description: Page size for the collection's matched items; defaults to 20.
    CollectionsSku:
      name: sku
      in: query
      required: false
      schema:
        type: string
      example: ABC123
      description: Restricts or biases the collection lookup to a specific product SKU.
    CollectionsSorting:
      name: sorting
      in: query
      required: false
      schema:
        type: string
      example: asc
      description: Sort direction, accepted alongside sort as a separate parameter on the same request.
    Feed:
      name: feed
      in: query
      required: false
      schema:
        type: string
      example: default
      description: Overrides the account's default feed for this request.
    Fields:
      name: fields
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
      example:
      - sku
      - price
      - imageUrl
      description: Comma-separated sparse fieldset selecting which fields to include in the response.
    GalleriesFields:
      name: fields
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
      example:
      - categories
      - gender
      - title
      description: Comma-separated fields to include on each matched product; a small default set is always included
        regardless.
    Locale:
      name: locale
      in: query
      required: false
      schema:
        type: string
      example: en-US
      description: BCP-47 locale for locale-sensitive response content; falls back to the account's default when
        omitted.
    MatchFilter:
      name: match_filter
      in: query
      required: false
      schema:
        type: string
        format: byte
      example: eyJjb2xvciI6ImJsdWUifQ==
      description: Base64-encoded JSON filter object, applied server-side to narrow matched results.
    V2Fields:
      name: fields
      in: query
      required: false
      schema:
        type: string
      example: sku,price,imageUrl
    V2ResponseFormat:
      name: response_format
      in: query
      required: false
      schema:
        type: string
        enum:
        - items
        - carousel
      example: items
      description: Selects the response layout for the collections endpoints - standard items or carousel.
    V2SizeColorVariants:
      name: size_color_variants
      in: query
      required: false
      schema:
        type: boolean
    RecentlyViewedForceCurrency:
      name: force_currency
      in: query
      required: false
      schema:
        type: string
      example: USD
      description: Overrides the account's default currency for displayed prices.
    RecentlyViewedSku:
      name: sku
      in: query
      required: false
      schema:
        type: string
      example: ABC123
      description: Identifies a product to fetch alongside the recently-viewed list, or to remove from it.
    RecentlyViewedSkuRequired:
      name: sku
      in: query
      required: true
      schema:
        type: string
      example: ABC123
      description: Identifies the item to remove from the recently-viewed list.
    RecentlyViewedUserUuidRequired:
      name: user_uuid
      in: query
      required: true
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Identifies whose recently-viewed history to modify; required on this operation.
    SessionId:
      name: session_id
      in: query
      required: false
      schema:
        type: string
      example: sess_9f2c8a
      description: Client-generated identifier for the current browsing/shopping session.
    SessionSkus:
      name: session_skus
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
      example:
      - SKU123
      - SKU456
      description: Comma-separated SKUs already seen or interacted with in the current session, used to bias or
        exclude results.
    SyteAppRef:
      name: syte_app_ref
      in: query
      required: false
      schema:
        type: string
      example: syte-widget-v3
      description: Identifies the calling app/SDK build, for analytics and debugging.
    SyteContext:
      name: syte_context
      in: query
      required: false
      schema:
        type: string
      example: widget
      description: Identifies the calling surface/integration and scopes which merchandising rules apply to the
        request.
    UserUuid:
      name: user_uuid
      in: query
      required: false
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Stable per-user identifier for personalization/attribution across sessions. Also accepted as
        syte_uuid.
    VariantFields:
      name: variant_fields
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
      example:
      - color
      - size
      description: Comma-separated variant-level fields to resolve alongside each matched or returned product.
    VariantId:
      name: variant_id
      in: query
      required: false
      schema:
        type: string
      example: variant_b
      description: Forces a specific A/B-test variant instead of letting the system assign one automatically.
    WidgetSku:
      name: sku
      in: query
      required: false
      schema:
        type: string
      description: Product SKU used for the widget's cache key and item lookup.
    WidgetSyteProduct:
      name: syte_product
      in: query
      required: false
      schema:
        type: string
        enum:
        - similars
        - collections
        - ctl
        - stl
        - fbt
        - recently_viewed
      example: similars
      description: Overrides the render strategy used for this campaign.
  schemas:
    CollectionsResponse:
      type: object
      description: Contains either `result` or `results`, depending on `response_format` (`items` by default, or
        `carousel`).
      properties:
        result:
          type: object
          description: Default (non-carousel) format.
          properties:
            aggregations:
              type: object
            hits:
              type: array
              items:
                type: object
            total:
              oneOf:
              - type: integer
              - type: string
              description: Total number of matching products.
        results:
          type: object
          description: Carousel format (`response_format=carousel`).
          properties:
            aggregations:
              type: object
            products:
              type: array
              items:
                type: object
            total:
              oneOf:
              - type: integer
              - type: string
              description: Total number of matching products.
            displayTitle:
              type: string
        message:
          type: string
          nullable: true
          description: Default (non-carousel) format only.
        error:
          type: string
          nullable: true
          description: Default (non-carousel) format only.
        feed:
          type: string
        fallbackApplied:
          type: boolean
          description: GET-only - see class description above.
        currency:
          type: object
          properties:
            rate:
              type: number
            currency:
              type: string
            originCurrency:
              type: string
            symbol:
              type: string
          description: Carousel format only.
    GalleryResponse:
      type: object
      description: The shoppable gallery's content.
      properties:
        id:
          type: string
        displayTitle:
          type: string
        layout:
          type: object
          properties:
            type:
              type: string
            gridImagesPerRow:
              type: number
            gridNumberOfRows:
              type: number
            carouselNumberOfImages:
              type: number
        showSimilarProductWhenUnavailable:
          type: boolean
        galleryName:
          type: string
        images:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              imageUrl:
                type: string
              altText:
                type: string
              caption:
                type: string
              tags:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    isAIDetected:
                      type: boolean
                    sku:
                      type: string
                    title:
                      type: string
                    coordinates:
                      type: object
                      properties:
                        x:
                          type: number
                        y:
                          type: number
                    matchDetails:
                      type: object
                      properties:
                        matchType:
                          type: string
                        reason:
                          type: string
                        similarsRequest:
                          type: string
              usage:
                type: string
        updatedAt:
          type: string
        bannerLink:
          type: string
        bannerTextLink:
          type: string
    PersonalizationResponse:
      type: object
      description: Recommendation results.
      properties:
        results:
          type: array
          items:
            type: object
            description: Opaque product object, shape driven by `fields`/ES doc.
        fallback:
          type: string
          example: best_sellers_no_SKU_param
          description: Either `"null"` or `"imageUrl"`. Present when `imageUrl` was supplied.
        modelName:
          type: string
          description: Present when results came directly from the recommendation model.
        experimentId:
          type: string
          description: Present only when the account's settings define an active experiment.
        variantId:
          type: string
          description: Present only when the account's settings define an active experiment.
    RecentlyViewedListResponse:
      type: object
      description: The user's recently viewed products, most recent first.
      properties:
        results:
          type: array
          items:
            type: object
        currency:
          type: object
          properties:
            rate:
              type: number
            originCurrency:
              type: string
            currency:
              type: string
            symbol:
              type: string
        requestId:
          type: string
        feed:
          type: string
          nullable: true
    MessageResponse:
      type: object
      description: Confirmation returned when a recently viewed item is removed or histories are merged.
      properties:
        message:
          type: string
        requestId:
          type: string
  responses:
    MissingApiKey:
      description: No API key was sent.
      content:
        application/json:
          example:
            error:
              message: API key is not provided
              code: 400
    InvalidApiKey:
      description: The API key is not valid for this account.
      content:
        application/json:
          example:
            error:
              message: API key YOUR_API_KEY is not valid
              code: 401
security:
- ApiKeyHeader: []
- ApiKeyQuery: []
